# Render Blueprint — deploys the API and the static frontend.
# Render Dashboard -> New -> Blueprint -> pick this repo.
#
# The database is NOT provisioned here. Render's free PostgreSQL is deleted
# after 30 days, which would silently break the link. The database lives on
# Neon instead, whose free tier persists; you paste its connection string when
# applying the blueprint (DATABASE_URL is marked `sync: false` below, so Render
# prompts for it and keeps it out of this file).
#
# After the first deploy the database is empty; load it from a machine that has
# the Elliptic CSVs (see report/DEPLOYMENT.md).

services:
  # ── API ────────────────────────────────────────────────────────────────
  - type: web
    name: tracer-api
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    # ONE worker on purpose: each worker loads its own ~162 MB copy of the
    # Random Forest and the serving matrix, so a second one would double
    # memory without improving throughput on a free instance.
    startCommand: gunicorn "run:app" --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Paste the Neon connection string when prompted. Prefer Neon's POOLED
      # endpoint (the host contains "-pooler"). config.py rewrites the scheme
      # for SQLAlchemy and adds sslmode=require if it is missing.
      - key: DATABASE_URL
        sync: false
      # Locked to the frontend below. Update if you attach a custom domain.
      - key: CORS_ORIGINS
        value: https://tracer-web.onrender.com
      # The README publishes this deployment's sign-in details so anyone can
      # look around, which means every visitor arrives as an administrator.
      # This makes the admin panel's write half read-only: the dashboards still
      # render, but no visitor can change a password, delete an account or
      # overwrite the stored benchmark. Remove it for a private deployment.
      - key: DEMO_MODE
        value: "true"

  # ── Frontend ───────────────────────────────────────────────────────────
  - type: web
    name: tracer-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Render appends a random suffix to service hostnames, so this cannot be
      # derived from the service name. Vite inlines it at BUILD time, so
      # changing it requires a rebuild, not just a restart.
      - key: VITE_API_URL
        value: https://tracer-api-68u0.onrender.com/api
    routes:
      # single-page app: let React Router handle unknown paths
      - type: rewrite
        source: /*
        destination: /index.html
